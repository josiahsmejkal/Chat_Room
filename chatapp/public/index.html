<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Room</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ad76c4, #7c6ee6);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: fadeIn 1s ease-in;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 650px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: slideUp 0.8s ease;
    }

    .chat-header {
      background: linear-gradient(to right, #6c5ce7, #a29bfe);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .join-container {
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      animation: fadeIn 1s ease-in;
      flex: 1;
      justify-content: center;
    }

    .join-container h3 {
      color: #6c5ce7;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .join-container input {
      padding: 14px;
      font-size: 16px;
      width: 85%;
      border-radius: 8px;
      border: 2px solid #ccc;
  
      outline: none;
      transition: 0.3s ease;
    }

    .join-container input:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 5px #dcd3fa;
    }

    .join-container button {
      padding: 12px 30px;
      background: linear-gradient(to right, #6c5ce7, #a29bfe);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .join-container button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(108, 92, 231, 0.4);
    }

    #chat-container {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8f9fd;
      animation: fadeIn 0.6s ease;
    }

    .message {
      margin-bottom: 15px;
      max-width: 75%;
      padding: 12px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      opacity: 0;
      animation: fadeInUp 0.4s forwards;
    }

    .message.user {
      background: #6c5ce7;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.other {
      background: #e0dffe;
      color: #2d3436;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

  

    #chat-form {
      display: flex;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #ddd;
    }

    #msg {
      flex-grow: 1;
      padding: 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s ease;
    }

    #msg:focus {
      border-color: #6c5ce7;
      box-shadow: 0 0 5px #dcd3fa;
    }

    button[type="submit"] {
      margin-left: 10px;
      background: linear-gradient(to right, #6c5ce7, #a29bfe);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      cursor: pointer;
      transition: 0.3s ease;
      font-size: 16px;
    }

    button[type="submit"]:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(108, 92, 231, 0.3);
    }

    

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">Chat Room 💬😎</div>

    <div id="join-container" class="join-container">
      <h3>Enter Your Name & Room Code</h3>
      <input type="text" id="username" placeholder="Your Name" required>
      <input type="text" id="room" placeholder="Room Code" required>
      <button id="join-btn">Join Room</button>
    </div>

    <div id="chat-container">
      <div id="messages" class="messages"></div>
      <form id="chat-form">
        <input type="text" id="msg" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const joinBtn = document.getElementById('join-btn');
    const joinContainer = document.getElementById('join-container');
    const chatContainer = document.getElementById('chat-container');
    const usernameInput = document.getElementById('username');
    const roomInput = document.getElementById('room');
    const messagesDiv = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const msgInput = document.getElementById('msg');

    let username = '';
    let room = '';

    joinBtn.addEventListener('click', () => {
      username = usernameInput.value.trim();
      room = roomInput.value.trim();

      if (username && room) {
        socket.emit('joinRoom', { username, room });
        joinContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
      }
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = msgInput.value.trim();
      if (message) {
        socket.emit('chatMessage', message);
        msgInput.value = '';
      }
    });

    socket.on('message', ({ username: sender, text }) => {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', sender === username ? 'user' : 'other');
      messageDiv.innerHTML = `<strong>${sender}</strong>: ${text}`;
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });
  </script>
</body>
</html>
